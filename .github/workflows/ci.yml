name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job name here is a required status check in the `main` ruleset;
# renaming one means updating the ruleset in the same change.
jobs:
  check:
    name: format, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: zig fmt
        run: zig fmt --check build.zig build.zig.zon src test
      # zigvet over its own source, the way a consuming repo runs it. The
      # build also refuses any dependency in build.zig.zon.
      - name: zigvet over src/
        run: zig build lint

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      # Unit tests and the case corpus, which also compiles every case.
      - name: zig build test
        run: zig build test --summary all

  # The released binaries are ReleaseSafe; ReleaseFast is how a consuming
  # repo may build it from source.
  release-modes:
    name: release (${{ matrix.optimize }})
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe, ReleaseFast]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: zig build test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all

  # Every binary a release carries, built on every change, so a tag never
  # finds a target that does not build.
  targets:
    name: release targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: zig build release
        run: zig build release && ls -l zig-out/release

  # A release binary is the same bytes wherever it is built, so anyone can
  # rebuild one from its tag and match SHA256SUMS: built here on Linux and
  # on macOS, from different checkout paths and empty caches, then compared.
  reproducible-build:
    name: reproducible build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: zig build release
        run: zig build release && cd zig-out/release && shasum -a 256 zigvet-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.os }}
          path: zig-out/release/SHA256SUMS

  # Runs when a build failed too, and fails then: a required check that is
  # skipped would pass.
  reproducible:
    name: reproducible
    needs: reproducible-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: both builds finished
        if: needs.reproducible-build.result != 'success'
        run: |
          echo "a reproducible build did not finish: ${{ needs.reproducible-build.result }}" >&2
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          path: sums
      - name: the same bytes on Linux and macOS
        run: diff sums/sums-ubuntu-latest/SHA256SUMS sums/sums-macos-latest/SHA256SUMS && echo "every release binary matches"
